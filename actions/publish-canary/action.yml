name: publish-canary
description: Publishes all workspace packages at 0.0.0-<preid>.<sha> under the <preid> dist-tag
inputs:
  registry:
    default: "https://npm.pkg.github.com"
  canary-preid:
    default: "canary"
  canary-publish-command:
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        CANARY_PREID: ${{ inputs.canary-preid }}
        CANARY_PUBLISH_COMMAND: ${{ inputs.canary-publish-command }}
      run: node "$GITHUB_ACTION_PATH/../../scripts/publish-canary.mjs"
